<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimesis Engine | Chess Intelligence</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e26;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 95%;
            padding: 20px;
        }

        /* Painel Lateral de Controles */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1.logo {
            font-size: 22px;
            margin: 0 0 20px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, select {
            background: #2a2a35;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        button {
            cursor: pointer;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-secondary {
            background: #333;
            color: #ccc;
            margin-top: 10px;
        }

        /* Tabuleiro */
        #board-container {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #myBoard {
            width: 500px;
            border: 5px solid #1e1e26;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Status e Histórico */
        .status-badge {
            background: #252530;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            border-left: 4px solid var(--accent);
            margin-bottom: 10px;
        }

        .move-history {
            height: 150px;
            overflow-y: auto;
            background: #16161d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: var(--accent);
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; align-items: center; }
            #myBoard { width: 350px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Esquerda: Configurações e Análise -->
    <div class="sidebar">
        <div class="card">
            <h1 class="logo">Mimesis Engine</h1>
            <form method="POST" class="form-group">
                <input type="text" name="username" placeholder="Usuário Chess.com" value="{{ username or '' }}" required>
                
                <select name="user_color">
                    <option value="white" {% if user_color == 'white' %}selected{% endif %}>Jogar de Brancas</option>
                    <option value="black" {% if user_color == 'black' %}selected{% endif %}>Jogar de Pretas</option>
                </select>

                <select name="level" id="levelSelect">
                    <option value="easy" {% if level == 'easy' %}selected{% endif %}>Nível: Iniciante</option>
                    <option value="normal" {% if level == 'normal' or not level %}selected{% endif %}>Nível: Intermediário</option>
                    <option value="hard" {% if level == 'hard' %}selected{% endif %}>Nível: Avançado</option>
                    <option value="legend" {% if level == 'legend' %}selected{% endif %}>Nível: Mimesis (Lenda)</option>
                </select>

                <button type="submit" class="btn-primary">Sincronizar DNA</button>
            </form>
        </div>

        {% if analysis %}
        <div class="card">
            <div class="status-badge">
                🧬 <strong>DNA Identificado:</strong> {{ username }}
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 13px;">
                <div style="color: #4caf50;">✔ Vitórias: {{ analysis.vitorias }}</div>
                <div style="color: #f44336;">✖ Derrotas: {{ analysis.derrotas }}</div>
            </div>
            <p style="font-size: 12px; color: var(--text-dim); margin-top: 15px;">Histórico de Partidas:</p>
            <div class="move-history" id="pgn-output">Aguardando lances...</div>
        </div>
        {% endif %}
    </div>

    <!-- Direita: Tabuleiro -->
    <div id="board-container">
        <div id="myBoard"></div>
        <div style="width: 100%; display: flex; gap: 10px; margin-top: 20px;">
            <button id="resetBtn" class="btn-secondary" style="flex: 1;">Reiniciar</button>
            <button id="flipBtn" class="btn-secondary" style="flex: 1;">Girar Tabuleiro</button>
        </div>
    </div>
</div>

<script>
    var board = null;
    var game = new Chess();
    var userColor = "{{ user_color or 'white' }}";
    var username = "{{ username or '' }}";
    var selectedLevel = "{{ level or 'normal' }}"; 

    function getPieceImg(piece) {
        var pieces = {
            'wP': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'wR': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'wN': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'wB': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'wQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'wK': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
            'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'bR': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'bN': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'bB': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'bQ': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'bK': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };
        return pieces[piece];
    }

    function updateHistory() {
        $('#pgn-output').text(game.pgn());
        $('#pgn-output').scrollTop($('#pgn-output')[0].scrollHeight);
    }

    function onDrop (source, target) {
        var turn = game.turn() === 'w' ? 'white' : 'black';
        if (turn !== userColor) return 'snapback';

        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        updateHistory();
        window.setTimeout(makeOpponentMove, 500);
    }

    function makeOpponentMove () {
        if (!username) return;
        $.post('/get_move', { 
            fen: game.fen(), 
            username: username, 
            level: selectedLevel 
        }, function(data) {
            if (data.move) {
                // Delay randômico para parecer humano
                setTimeout(function() {
                    game.move(data.move, { sloppy: true });
                    board.position(game.fen());
                    updateHistory();
                    if (game.game_over()) setTimeout(() => alert("Fim de partida."), 250);
                }, Math.random() * 1000 + 800);
            }
        });
    }

    var config = {
        draggable: true,
        position: 'start',
        orientation: userColor,
        onDrop: onDrop,
        pieceTheme: getPieceImg
    };

    board = ChessBoard('myBoard', config);

    if (userColor === 'black' && username) {
        window.setTimeout(makeOpponentMove, 1000);
    }

    $('#resetBtn').on('click', function() {
        game.reset();
        board.start();
        updateHistory();
        if (userColor === 'black' && username) makeOpponentMove();
    });

    $('#flipBtn').on('click', function() { board.flip(); });
</script>
</body>
</html>
